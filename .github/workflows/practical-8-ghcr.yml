
name: Practical 8 - Publish Student Result Image to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated tests
        run: python -m unittest discover -v

      - name: Set GHCR image name
        id: image
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/student-result-prediction" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.image.outputs.name }}:v1" \
            -t "${{ steps.image.outputs.name }}:latest" .

      - name: Start test container
        run: |
          docker run -d \
            --name student-result-ghcr-test \
            -p 5000:5000 \
            "${{ steps.image.outputs.name }}:v1"

      - name: Test application health
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Health check passed."
              exit 0
            fi
            sleep 2
          done

          docker logs student-result-ghcr-test
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Stop test container
        if: always()
        run: docker rm -f student-result-ghcr-test || true

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Publish image to GHCR
        run: |
          docker push "${{ steps.image.outputs.name }}:v1"
          docker push "${{ steps.image.outputs.name }}:latest"

      - name: Show published image references
        run: |
          echo "${{ steps.image.outputs.name }}:v1"
          echo "${{ steps.image.outputs.name }}:latest"
